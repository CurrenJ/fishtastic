plugins {
    id 'dev.architectury.loom-no-remap' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.26' apply false
}

// Load local.properties for CurseForge token (git-ignored)
if (file('local.properties').exists()) {
    def localProps = new Properties()
    file('local.properties').withInputStream { localProps.load(it) }
    localProps.each { key, value -> ext.set(key, value) }
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
}

subprojects {
    // tools/* are standalone dev tooling (see docs/fish-tanks.md) and :fishsim is the
    // Minecraft-free simulation engine (see docs/fish-sim-engine-plan.md) — plain Java,
    // deliberately independent of Minecraft/Loom/Architectury. Configured in their own
    // build files (tools/* additionally in the configure block below).
    if (project.path.startsWith(':tools:') || project.path == ':fishsim') {
        return
    }

    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        mavenLocal()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        // loom-no-remap: MC 26.1+ is unobfuscated — no mappings dependency needed
    }

    java {
        // Loom will automatically attach sourcesJar to the "build" task if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        // Mojang ships Java 25 to end users in 26.1, so mods should target Java 25.
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

// ── tools/* (standalone dev tooling, no Minecraft/Loom) ───────────────────

configure(subprojects.findAll { it.path.startsWith(':tools:') }) {
    apply plugin: 'java-library'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
    }
}

// ── CurseForge Publishing ────────────────────────────────────────────────

import net.darkhax.curseforgegradle.TaskPublishCurseForge

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = System.getenv('CURSEFORGE_TOKEN') ?: findProperty('curseforge_token') ?: ''

    def projectId = findProperty('curseforge_project_id') ?: '0'
    def releaseType = findProperty('release_type') ?: 'release'
    def changelogText = findProperty('changelog_override')
            ?: (file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : 'No changelog provided.')

    // ── Fabric ──
    def fabricJar = project(':fabric').tasks.named('shadowJar').get().archiveFile
    def fabricUpload = upload(projectId, fabricJar)
    fabricUpload.changelog = changelogText
    fabricUpload.changelogType = 'markdown'
    fabricUpload.releaseType = releaseType
    fabricUpload.addGameVersion(minecraft_version)
    fabricUpload.addModLoader('Fabric')
    fabricUpload.displayName = fabricJar.get().asFile.name.replace('.jar', '')

    // ── NeoForge ──
    def neoJar = project(':neoforge').tasks.named('shadowJar').get().archiveFile
    def neoUpload = upload(projectId, neoJar)
    neoUpload.changelog = changelogText
    neoUpload.changelogType = 'markdown'
    neoUpload.releaseType = releaseType
    neoUpload.addGameVersion(minecraft_version)
    neoUpload.addModLoader('NeoForge')
    neoUpload.displayName = neoJar.get().asFile.name.replace('.jar', '')
}

// Ensure publish depends on both platforms being built.
tasks.named('publishCurseForge') {
    dependsOn(':fabric:build', ':neoforge:build')
}
