// Build checks that keep the backport seams in place (see docs/backport-plan.md §8 on the port branch).
//
// Each check reads the constant pool of every compiled class in every source set (main, test,
// testmod) and fails the build on references that would otherwise have to be rewritten on the
// 1.21.1 / 1.20.1 branches. They check bytecode, not sources, because javac records the receiver's
// static type as the owner of each method reference. That makes the checks type-exact where a grep
// isn't: List#reversed (Java 21) vs Comparator#reversed (Java 8), List#addLast vs Deque#addLast.
//
// Applied to every Loom subproject from the root build.gradle. Both checks run before :common:test
// and each platform's runGametest (so the pre-commit hook covers them), and as part of `check`.
// They need nothing but the JDK, so they also run on the port branches' JDK 21/17 Gradle.

/** Shared plumbing: parses class files and reports what {@link #violations} returns. */
abstract class BackportGuard extends DefaultTask {
    /** The parts of one class file's constant pool the checks look at. */
    static class ClassRefs {
        String self
        /** Method and field references: [owner, name, descriptor], owner in internal form. */
        List<List<String>> members = []
        /** Class constants, internal form. */
        List<String> classes = []
        /** Every UTF-8 constant (includes the class's own field/method descriptors and signatures). */
        List<String> strings = []
    }

    @InputFiles
    @SkipWhenEmpty
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getClassDirs()

    @OutputFile
    abstract RegularFileProperty getReport()

    @Internal
    abstract String getFailureMessage()

    abstract List<String> violations(ClassRefs refs)

    @TaskAction
    void check() {
        List<String> found = []
        classDirs.asFileTree.matching { include '**/*.class' }.visit { details ->
            if (details.directory) return
            details.file.withInputStream { stream ->
                found.addAll(violations(read(new DataInputStream(new BufferedInputStream(stream)))).unique())
            }
        }
        found.sort()
        report.get().asFile.text = found.join('\n') + (found ? '\n' : '')
        if (found) {
            throw new GradleException("$failureMessage (see gradle/backport-guards.gradle):\n  " + found.join('\n  '))
        }
    }

    static ClassRefs read(DataInputStream input) {
        if ((input.readInt() & 0xFFFFFFFFL) != 0xCAFEBABEL) throw new IllegalStateException('not a class file')
        input.readUnsignedShort(); input.readUnsignedShort() // minor, major
        int count = input.readUnsignedShort()
        String[] utf8 = new String[count]
        int[] tags = new int[count]
        int[] a = new int[count]
        int[] b = new int[count]
        for (int i = 1; i < count; i++) {
            int tag = input.readUnsignedByte()
            tags[i] = tag
            switch (tag) {
                case 1: utf8[i] = input.readUTF(); break
                case 3: case 4: input.readInt(); break
                case 5: case 6: input.readLong(); i++; break
                case 7: case 8: case 16: case 19: case 20: a[i] = input.readUnsignedShort(); break
                case 9: case 10: case 11: case 12: case 17: case 18:
                    a[i] = input.readUnsignedShort(); b[i] = input.readUnsignedShort(); break
                case 15: input.readUnsignedByte(); a[i] = input.readUnsignedShort(); break
                default: throw new IllegalStateException("unknown constant pool tag $tag")
            }
        }
        input.readUnsignedShort() // access flags
        ClassRefs refs = new ClassRefs()
        refs.self = utf8[a[input.readUnsignedShort()]]
        for (int i = 1; i < count; i++) {
            if (tags[i] == 1) refs.strings << utf8[i]
            else if (tags[i] == 7) refs.classes << utf8[a[i]]
            else if (tags[i] >= 9 && tags[i] <= 11) refs.members << [utf8[a[a[i]]], utf8[a[b[i]]], utf8[b[b[i]]]]
        }
        return refs
    }

    static String describe(String self, List<String> member) {
        "$self: ${member[0].replace('/', '.')}#${member[1]}${member[2]}"
    }
}

// ── S5: Java 17 library calls ────────────────────────────────────────────────
//
// common, fabric and neoforge compile against MC 26.1.2's Java 25 class files, so `--release 17`
// can't be used on them the way it is on :fishsim and :tools:* (S3). The 1.20.1 backport runs on
// Java 17. This fails on the Java 21 sequenced-collection API and Math.clamp.
//
// Replacements: getFirst() -> get(0), getLast() -> get(size() - 1), reversed() -> Guava
// Lists.reverse(list), removeFirst()/addFirst(x)/addLast(x) on a List -> remove(0)/add(0, x)/add(x),
// Math.clamp -> Mth.clamp, SequencedMap/SequencedCollection as a declared type -> Map/List.
abstract class Java17ApiGuard extends BackportGuard {
    /** Deque types, on which the first/last methods have existed since Java 6. */
    static final Set<String> DEQUE_OWNERS = [
            'java/util/Deque', 'java/util/ArrayDeque', 'java/util/LinkedList',
            'java/util/concurrent/BlockingDeque', 'java/util/concurrent/LinkedBlockingDeque',
            'java/util/concurrent/ConcurrentLinkedDeque',
    ] as Set
    static final Set<String> FIRST_LAST = ['getFirst', 'getLast', 'removeFirst', 'removeLast', 'addFirst', 'addLast'] as Set
    static final Set<String> SEQUENCED_MAP_METHODS = [
            'putFirst', 'putLast', 'sequencedKeySet', 'sequencedValues', 'sequencedEntrySet',
            'firstEntry', 'lastEntry', 'pollFirstEntry', 'pollLastEntry',
    ] as Set
    static final String SEQUENCED = 'java/util/Sequenced'

    /**
     * Classes allowed to name a Sequenced* type in a descriptor. A mixin @Accessor must declare the
     * target field's exact type (Mixin matches the field by descriptor), and
     * MultiBufferSource.BufferSource#fixedBuffers is a SequencedMap on 26.1.2 and 1.21.1. On 1.20.1
     * the field is a Map<RenderType, BufferBuilder>, so the render rewrite (B5.2) changes both anyway.
     */
    static final Set<String> SEQUENCED_DESCRIPTOR_ALLOWED = [
            'grill24/fishtastic/mixin/accessor/BufferSourceAccessor',
            'grill24/fishtastic/mixin/RenderBuffersMixin',
    ] as Set

    @Override
    String getFailureMessage() { 'Java 21-only API calls found (the 1.20.1 backport is Java 17)' }

    @Override
    List<String> violations(ClassRefs refs) {
        List<String> found = []
        refs.classes.findAll { it.startsWith(SEQUENCED) }.each { found << "${refs.self}: uses $it" }
        boolean descriptorsAllowed = refs.self in SEQUENCED_DESCRIPTOR_ALLOWED
        refs.members.each { m ->
            if (isBanned(m[0], m[1]) || (!descriptorsAllowed && m[2].contains('L' + SEQUENCED))) {
                found << describe(refs.self, m)
            }
        }
        if (!descriptorsAllowed) {
            // Field and method declarations (and generic signatures) of the class itself.
            refs.strings.findAll { s -> s.contains('L' + SEQUENCED) && !found.any { it.contains(s) } }
                    .each { found << "${refs.self}: declares $it" }
        }
        return found
    }

    static boolean isBanned(String owner, String name) {
        if ((owner == 'java/lang/Math' || owner == 'java/lang/StrictMath') && name == 'clamp') return true
        if (!owner.startsWith('java/util/')) return false
        if (owner.startsWith(SEQUENCED)) return true
        if (name in FIRST_LAST) return !(owner in DEQUE_OWNERS)
        if (name == 'reversed') return owner != 'java/util/Comparator'
        if (name in SEQUENCED_MAP_METHODS) return owner == 'java/util/LinkedHashMap' || owner == 'java/util/LinkedHashSet'
        return false
    }
}

// ── S6c: id construction goes through util/Ids ───────────────────────────────
//
// 26.1.2 builds ids with Identifier's static factories, 1.21.1 with the same factories on
// ResourceLocation, and 1.20.1 with `new ResourceLocation(...)`. grill24.fishtastic.util.Ids wraps
// them, so each branch changes only Ids. This fails on a direct call anywhere else.
// Replacements: Identifier.fromNamespaceAndPath -> Ids.of, and Identifier.withDefaultNamespace /
// parse / tryParse -> the Ids method with the same name.
abstract class IdConstructionGuard extends BackportGuard {
    static final Set<String> ID_TYPES = ['net/minecraft/resources/Identifier', 'net/minecraft/resources/ResourceLocation'] as Set
    static final Set<String> FACTORIES = ['fromNamespaceAndPath', 'withDefaultNamespace', 'parse', 'tryParse', '<init>'] as Set
    static final String IDS = 'grill24/fishtastic/util/Ids'

    @Override
    String getFailureMessage() { 'Resource ids constructed outside grill24.fishtastic.util.Ids' }

    @Override
    List<String> violations(ClassRefs refs) {
        if (refs.self == IDS) return []
        return refs.members.findAll { it[0] in ID_TYPES && it[1] in FACTORIES }.collect { describe(refs.self, it) }
    }
}

def guards = [
        tasks.register('java17ApiGuard', Java17ApiGuard) {
            description = 'Fails on Java 21-only library calls (the 1.20.1 backport runs on Java 17).'
        },
        tasks.register('idConstructionGuard', IdConstructionGuard) {
            description = 'Fails on resource id construction outside grill24.fishtastic.util.Ids.'
        },
]
guards.each { guard ->
    guard.configure {
        group = 'verification'
        // Lazy: the platform projects add their testmod source set after this script is applied.
        classDirs.from({ sourceSets.collect { it.output.classesDirs } })
        report = layout.buildDirectory.file("reports/${name}.txt")
    }
}

tasks.named('check') { dependsOn guards }
tasks.matching { it.name == 'test' || it.name == 'runGametest' }.configureEach { dependsOn guards }
