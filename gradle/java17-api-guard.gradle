// Java 17 API guard (backport seam S5).
//
// common, fabric and neoforge compile against MC 26.1.2's Java 25 class files, so `--release 17`
// can't be used to keep them free of Java 18+ library calls the way :fishsim and :tools:* are (S3).
// The 1.20.1 backport runs on Java 17, and every call below would otherwise have to be rewritten
// on that branch. This task reads the compiled classes of every source set and fails the build on
// references to the Java 21 sequenced-collection API and Math.clamp.
//
// It checks bytecode, not sources, because javac records the receiver's static type as the owner
// of each method reference. A source grep can't tell List#reversed (Java 21) from
// Comparator#reversed (Java 8), or List#addLast from Deque#addLast, and all of those appear in the tree.
//
// Replacements: getFirst() -> get(0), getLast() -> get(size() - 1), reversed() -> Guava
// Lists.reverse(list), removeFirst()/addFirst(x)/addLast(x) on a List -> remove(0)/add(0, x)/add(x),
// Math.clamp -> Mth.clamp, SequencedMap/SequencedCollection as a declared type -> Map/List.
//
// Applied to every Loom subproject from the root build.gradle. Runs before :common:test and each
// platform's runGametest (so the pre-commit hook covers it), and as part of `check`.

abstract class Java17ApiGuard extends DefaultTask {
    /** Deque types, on which the first/last methods have existed since Java 6. */
    static final Set<String> DEQUE_OWNERS = [
            'java/util/Deque', 'java/util/ArrayDeque', 'java/util/LinkedList',
            'java/util/concurrent/BlockingDeque', 'java/util/concurrent/LinkedBlockingDeque',
            'java/util/concurrent/ConcurrentLinkedDeque',
    ] as Set
    static final Set<String> FIRST_LAST = ['getFirst', 'getLast', 'removeFirst', 'removeLast', 'addFirst', 'addLast'] as Set
    static final Set<String> SEQUENCED_MAP_METHODS = [
            'putFirst', 'putLast', 'sequencedKeySet', 'sequencedValues', 'sequencedEntrySet',
            'firstEntry', 'lastEntry', 'pollFirstEntry', 'pollLastEntry',
    ] as Set
    static final String SEQUENCED = 'java/util/Sequenced'

    /**
     * Classes allowed to name a Sequenced* type in a descriptor. A mixin @Accessor must declare the
     * target field's exact type (Mixin matches the field by descriptor), and
     * MultiBufferSource.BufferSource#fixedBuffers is a SequencedMap on 26.1.2 and 1.21.1. On 1.20.1
     * the field is a Map<RenderType, BufferBuilder>, so the render rewrite (B5.2) changes both anyway.
     */
    static final Set<String> SEQUENCED_DESCRIPTOR_ALLOWED = [
            'grill24/fishtastic/mixin/accessor/BufferSourceAccessor',
            'grill24/fishtastic/mixin/RenderBuffersMixin',
    ] as Set

    @InputFiles
    @SkipWhenEmpty
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getClassDirs()

    @OutputFile
    abstract RegularFileProperty getReport()

    @TaskAction
    void check() {
        List<String> violations = []
        classDirs.asFileTree.matching { include '**/*.class' }.visit { details ->
            if (details.directory) return
            details.file.withInputStream { stream ->
                violations.addAll(scan(new DataInputStream(new BufferedInputStream(stream))))
            }
        }
        violations.sort()
        report.get().asFile.text = violations.join('\n') + (violations ? '\n' : '')
        if (violations) {
            throw new GradleException("Java 21-only API calls found (the 1.20.1 backport is Java 17; see gradle/java17-api-guard.gradle):\n  "
                    + violations.join('\n  '))
        }
    }

    /** Reads a class file's constant pool and returns one line per banned reference. */
    static List<String> scan(DataInputStream input) {
        if ((input.readInt() & 0xFFFFFFFFL) != 0xCAFEBABEL) throw new IllegalStateException('not a class file')
        input.readUnsignedShort(); input.readUnsignedShort() // minor, major
        int count = input.readUnsignedShort()
        String[] utf8 = new String[count]
        int[] tags = new int[count]
        int[] a = new int[count]
        int[] b = new int[count]
        for (int i = 1; i < count; i++) {
            int tag = input.readUnsignedByte()
            tags[i] = tag
            switch (tag) {
                case 1: utf8[i] = input.readUTF(); break
                case 3: case 4: input.readInt(); break
                case 5: case 6: input.readLong(); i++; break
                case 7: case 8: case 16: case 19: case 20: a[i] = input.readUnsignedShort(); break
                case 9: case 10: case 11: case 12: case 17: case 18:
                    a[i] = input.readUnsignedShort(); b[i] = input.readUnsignedShort(); break
                case 15: input.readUnsignedByte(); a[i] = input.readUnsignedShort(); break
                default: throw new IllegalStateException("unknown constant pool tag $tag")
            }
        }
        input.readUnsignedShort() // access flags
        String self = utf8[a[input.readUnsignedShort()]]

        List<String> found = []
        for (int i = 1; i < count; i++) {
            if (tags[i] == 7 && utf8[a[i]].startsWith(SEQUENCED)) {
                found << "$self: uses ${utf8[a[i]]}"
            } else if (tags[i] >= 9 && tags[i] <= 11) {
                String owner = utf8[a[a[i]]]
                String name = utf8[a[b[i]]]
                String desc = utf8[b[b[i]]]
                if (isBanned(owner, name)) {
                    found << "$self: ${owner.replace('/', '.')}#$name$desc"
                } else if (desc.contains('L' + SEQUENCED) && !(self in SEQUENCED_DESCRIPTOR_ALLOWED)) {
                    found << "$self: ${owner.replace('/', '.')}#$name$desc"
                }
            }
        }
        if (!(self in SEQUENCED_DESCRIPTOR_ALLOWED)) {
            // Field and method declarations (and generic signatures) of the class itself.
            for (int i = 1; i < count; i++) {
                if (tags[i] == 1 && utf8[i].contains('L' + SEQUENCED) && !found.any { it.contains(utf8[i]) }) {
                    found << "$self: declares ${utf8[i]}"
                }
            }
        }
        return found.unique()
    }

    static boolean isBanned(String owner, String name) {
        if ((owner == 'java/lang/Math' || owner == 'java/lang/StrictMath') && name == 'clamp') return true
        if (!owner.startsWith('java/util/')) return false
        if (owner.startsWith(SEQUENCED)) return true
        if (name in FIRST_LAST) return !(owner in DEQUE_OWNERS)
        if (name == 'reversed') return owner != 'java/util/Comparator'
        if (name in SEQUENCED_MAP_METHODS) return owner == 'java/util/LinkedHashMap' || owner == 'java/util/LinkedHashSet'
        return false
    }
}

def java17ApiGuard = tasks.register('java17ApiGuard', Java17ApiGuard) {
    group = 'verification'
    description = 'Fails on Java 21-only library calls (the 1.20.1 backport runs on Java 17).'
    // Lazy: the platform projects add their testmod source set after this script is applied.
    classDirs.from({ sourceSets.collect { it.output.classesDirs } })
    report = layout.buildDirectory.file('reports/java17ApiGuard.txt')
}

tasks.named('check') { dependsOn java17ApiGuard }
tasks.matching { it.name == 'test' || it.name == 'runGametest' }.configureEach { dependsOn java17ApiGuard }
