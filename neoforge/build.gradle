plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        // Platform-agnostic GameTest logic lives in common/ so Fabric can share it too.
        java.srcDir(project(':common').file('src/testmod/java'))
        resources.srcDir(project(':common').file('src/testmod/resources'))
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation("io.github.currenj.gelatinui:gelatinui-neoforge:${gelatinui_version}")

    // JEI integration is optional at runtime — compile-only api, plus the full jar as a
    // dev-time convenience so `runClient` can exercise the integration locally.
    // transitive = false: JEI's published neoforge-api/neoforge POMs declare their common-api
    // dependency under a bogus "build" groupId (a JEI publishing quirk), which fails
    // resolution — harmless to disable since we depend on common-api explicitly ourselves.
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-neoforge-api:${rootProject.jei_version}") { transitive = false }
    localRuntime("mezz.jei:jei-${rootProject.minecraft_version}-neoforge:${rootProject.jei_version}") { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Flocking engine (docs/fish-sim-engine-plan.md): runtime code, so it needs BOTH a dev
    // classpath dep and a shadowBundle entry — dev runs resolve the former, the shipped jar only
    // contains the latter (skipping it = NoClassDefFoundError in production).
    implementation project(':fishsim')
    shadowBundle project(':fishsim')

    // Testmod: access the compiled main classes.
    testmodImplementation sourceSets.main.output
    testmodImplementation sourceSets.main.output
    // A6.1: compile-only NeoForge gametest annotations, so the shared harness in
    // common/src/testmod can carry the holder NeoForge 21.1 requires. Never a runtime dependency.
    testmodCompileOnly project(path: ':common', configuration: 'neoforgeGametestAnnotationsApi')
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version

    from project(":common").sourceSets.main.resources

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            'version': project.version,
            'mod_license': rootProject.mod_license,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_authors': rootProject.mod_authors,
            'mod_description': rootProject.mod_description,
            'mod_icon': rootProject.mod_icon,
            'mod_neoforge_version_range': "[${rootProject.neoforge_version},)",
            'mod_minecraft_version_range': "[${rootProject.minecraft_version},)",
            'mod_gelatinui_version_range': "[${gelatinui_version},)"
        ])
    }
}

// shadowJar bundles common + fishsim into a dev jar; remapJar produces the published jar.
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // Dev-only MCP bridge tooling - never ship it. Every call site into these packages is guarded by
    // grill24.fishtastic.env.DevEnvironmentCheck, which stays in the jar, so a missing class here is safe.
    exclude 'grill24/fishtastic/mcp/**'
    exclude 'grill24/fishtastic/neoforge/mcp/**'

    // fishsim's render/harness/viewer packages are dev-only verification tooling (headless PNG/GIF
    // export, the desktop viewer) — only core/ and domain/ are reachable from the mod at runtime.
    exclude 'grill24/fishsim/render/**'
    exclude 'grill24/fishsim/harness/**'
    exclude 'grill24/fishsim/viewer/**'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// neoforge/build.gradle
sourceSets.main.resources.srcDir("src/main/generated")

// Gradle 9.2+ requires explicit duplicatesStrategy when sources overlap.
tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

loom {
    // Without this, Loom only ever associates sourceSets.main with the "fishtastic"
    // mod's class roots (MOD_CLASSES env var), so FML's per-mod composite classloader
    // never sees testmod's compiled classes — @EventBusSubscriber-annotated classes
    // there (e.g. NeoForgeGameTestRegistration) silently never get discovered/fired,
    // even though they're on the JVM classpath for the gametest run.
    // The group must be named "main": Loom always adds a default "main" group (main
    // classes only), and a second group for the same mod makes FML pick one of the two
    // ("Found 2 mod files for modid fishtastic, selecting main"), dropping testmod again.
    // :fishsim is in the group too (port-only): FML 4 loads the mod's dev classes into their own
    // module, which cannot see a plain project jar on the classpath, so without this every tank
    // render dies with NoClassDefFoundError: grill24/fishsim/... The shipped jar shadows fishsim in.
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet sourceSets.testmod
            sourceSet("main", project(':fishsim'))
        }
    }

    runs {
        // Fixed window size, so the self-test's evidence screenshots are comparable between the
        // two loaders and with docs/port-evidence/1.21.1 (the guiscale scene resizes to 1920x1080
        // and restores this). Flagged at G1; see docs/backport-pass2/track-a5-rendering-1.21.1.md.
        client {
            programArgs "--width", "1600", "--height", "900"
        }

        data {
            // Despite NeoForge's userdev config.json listing the run template under
            // the key "serverData", Architectury Loom 1.14.476 internally re-keys it
            // as "dataServer" (and "clientData" -> "dataClient"). serverData() looks
            // up the correct ("dataServer") name, so prefer it over forgeTemplate().
            serverData()
            programArgs "--mod", "fishtastic",
                        "--all",
                        "--output", file("src/main/generated").absolutePath
        }

        // Headless game test server — runs all registered tests then exits.
        // Run with: ./gradlew :neoforge:runGametest
        // NOTE: Generate test structure files first with: ./gradlew :neoforge:runData
        gametest {
            // No gameTestServer() convenience method exists on RunConfigSettings in
            // this Loom version; use the generic forgeTemplate() lookup instead.
            environment("gameTestServer")
            forgeTemplate("gameTestServer")
            source sourceSets.testmod
            name "Game Test Server"
            // The shared harness carries @GameTestHolder("fishtastic") (compiled against the
            // compile-only stubs in common/src/neoforge-gametest-annotations), so its tests resolve
            // to this namespace and the filter keeps them - and keeps anything else out.
            // See "A6.1 as built" in docs/backport-pass2/track-a-1.21.1.md.
            vmArg "-Dneoforge.enabledGameTestNamespaces=fishtastic"
            runDir "build/gametest"
        }
    }
}

// Custom (non-default) runDirs aren't auto-created by Loom/Architectury before the
// run task executes — unlike the default "run" dir, which gets created during IDE
// sync. Without this, a fresh checkout fails the first `runGametest` invocation with
// "Working directory '...\build\gametest' does not exist".
file("build/gametest").mkdirs()
