plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        // Platform-agnostic GameTest logic lives in common/ so Fabric can share it too.
        java.srcDir(project(':common').file('src/testmod/java'))
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    implementation("io.github.currenj.gelatinui:gelatinui-neoforge:${gelatinui_version}")

    // namedElements no longer exists in loom-no-remap; reference common directly.
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Flocking engine (docs/fish-sim-engine-plan.md): runtime code, so it needs BOTH a dev
    // classpath dep and a shadowBundle entry — dev runs resolve the former, the shipped jar only
    // contains the latter (skipping it = NoClassDefFoundError in production).
    implementation project(':fishsim')
    shadowBundle project(':fishsim')

    // Testmod: access the compiled main classes.
    testmodImplementation sourceSets.main.output
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version

    from project(":common").sourceSets.main.resources

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            'version': project.version,
            'mod_license': rootProject.mod_license,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_authors': rootProject.mod_authors,
            'mod_description': rootProject.mod_description,
            'mod_icon': rootProject.mod_icon,
            'mod_neoforge_version_range': "[${rootProject.neoforge_version},)",
            'mod_minecraft_version_range': "[${rootProject.minecraft_version},)",
            'mod_gelatinui_version_range': "[${gelatinui_version},)"
        ])
    }
}

// loom-no-remap: remapJar is gone. Mark the default jar as raw so shadowJar can
// build on top of the Loom-modified output.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()           // don't re-include source set output directly
    from(zipTree(jar.archiveFile))         // unpack the Loom-processed jar as the base
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null               // shadowJar becomes the primary artifact

    // Dev-only MCP bridge tooling - never ship it. Every call site into these packages is guarded by
    // grill24.fishtastic.env.DevEnvironmentCheck, which stays in the jar, so a missing class here is safe.
    exclude 'grill24/fishtastic/mcp/**'
    exclude 'grill24/fishtastic/neoforge/mcp/**'

    // fishsim's render/harness/viewer packages are dev-only verification tooling (headless PNG/GIF
    // export, the desktop viewer) — only core/ and domain/ are reachable from the mod at runtime.
    exclude 'grill24/fishsim/render/**'
    exclude 'grill24/fishsim/harness/**'
    exclude 'grill24/fishsim/viewer/**'
}

// Redirect components.java to publish the shadow jar instead of the plain jar.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

// neoforge/build.gradle
sourceSets.main.resources.srcDir("src/main/generated")

// Gradle 9.2+ requires explicit duplicatesStrategy when sources overlap.
tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

loom {
    // Without this, Loom only ever associates sourceSets.main with the "fishtastic"
    // mod's class roots (MOD_CLASSES env var), so FML's per-mod composite classloader
    // never sees testmod's compiled classes — @EventBusSubscriber-annotated classes
    // there (e.g. NeoForgeGameTestRegistration) silently never get discovered/fired,
    // even though they're on the JVM classpath for the gametest run.
    mods {
        fishtastic {
            sourceSet sourceSets.main
            sourceSet sourceSets.testmod
        }
    }

    runs {
        data {
            // Despite NeoForge's userdev config.json listing the run template under
            // the key "serverData", Architectury Loom 1.14.476 internally re-keys it
            // as "dataServer" (and "clientData" -> "dataClient"). serverData() looks
            // up the correct ("dataServer") name, so prefer it over forgeTemplate().
            serverData()
            programArgs "--mod", "fishtastic",
                        "--all",
                        "--output", file("src/main/generated").absolutePath
        }

        // Headless game test server — runs all registered tests then exits.
        // Run with: ./gradlew :neoforge:runGametest
        // NOTE: Generate test structure files first with: ./gradlew :neoforge:runData
        gametest {
            // No gameTestServer() convenience method exists on RunConfigSettings in
            // this Loom version; use the generic forgeTemplate() lookup instead.
            environment("gameTestServer")
            forgeTemplate("gameTestServer")
            source sourceSets.testmod
            name "Game Test Server"
            vmArg "-Dneoforge.enabledGameTestNamespaces=fishtastic"
            runDir "build/gametest"
        }
    }
}

// Custom (non-default) runDirs aren't auto-created by Loom/Architectury before the
// run task executes — unlike the default "run" dir, which gets created during IDE
// sync. Without this, a fresh checkout fails the first `runGametest` invocation with
// "Working directory '...\build\gametest' does not exist".
file("build/gametest").mkdirs()
