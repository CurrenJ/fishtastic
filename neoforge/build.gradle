plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    implementation("io.github.currenj.gelatinui:gelatinui-neoforge:${gelatinui_version}")

    // namedElements no longer exists in loom-no-remap; reference common directly.
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version

    from project(":common").sourceSets.main.resources

    filesMatching('META-INF/neoforge.mods.toml') {
        expand([
            'version': project.version,
            'mod_license': rootProject.mod_license,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_authors': rootProject.mod_authors,
            'mod_description': rootProject.mod_description,
            'mod_icon': rootProject.mod_icon,
            'mod_neoforge_version_range': "[${rootProject.neoforge_version},)",
            'mod_minecraft_version_range': "[${rootProject.minecraft_version},)",
            'mod_gelatinui_version_range': "[${gelatinui_version},)"
        ])
    }
}

// loom-no-remap: remapJar is gone. Mark the default jar as raw so shadowJar can
// build on top of the Loom-modified output.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()           // don't re-include source set output directly
    from(zipTree(jar.archiveFile))         // unpack the Loom-processed jar as the base
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null               // shadowJar becomes the primary artifact
}

// Redirect components.java to publish the shadow jar instead of the plain jar.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

// neoforge/build.gradle
sourceSets.main.resources.srcDir("src/main/generated")

loom {
    runs {
        data {
            data()
            programArgs "--mod", "fishtastic",
                        "--all",
                        "--output", file("src/main/generated").absolutePath
        }
    }
}
