plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets {
    testmod {
        // Platform-agnostic GameTest logic lives in common/ so NeoForge can share it too.
        java.srcDir(project(':common').file('src/testmod/java'))
        resources.srcDir(project(':common').file('src/testmod/resources'))
    }
}

// Extend the configurations, not the source set's classpath properties. Loom resolves and remaps
// mod* dependencies (Fabric API) through its own configurations, and `compileClasspath +=
// main.compileClasspath` picks up a pre-remap snapshot without them (potions-plus mc-1.21.1).
configurations.testmodCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.testmodRuntimeClasspath.extendsFrom(configurations.runtimeClasspath)

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation("io.github.currenj.gelatinui:gelatinui-fabric:${gelatinui_version}")

    // JEI integration is optional at runtime — compile-only api, plus the full jar as a
    // dev-time convenience so `runClient` can exercise the integration locally.
    // transitive = false: JEI's published fabric-api/fabric POMs declare their common-api
    // dependency under a bogus "build" groupId (a JEI publishing quirk), which fails
    // resolution — harmless to disable since we depend on common-api explicitly ourselves.
    // The runtime jar is a real Fabric mod with an intermediary access widener, so it goes through
    // Loom's mod-aware modLocalRuntime (remapped to named), not plain localRuntime.
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}") { transitive = false }
    modLocalRuntime("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}") { transitive = false }

    // Shared fish tank shape geometry generators (plain Java, no Minecraft dep) — also consumed
    // by tools/tank-shape-previewer. See docs/fish-tanks.md, Phase 1.
    implementation project(':tools:tank-shape-gen')

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Flocking engine (docs/fish-sim-engine-plan.md): runtime code, so unlike tools:tank-shape-gen
    // it needs BOTH a dev classpath dep and a shadowBundle entry — dev runs resolve the former,
    // the shipped jar only contains the latter (skipping it = NoClassDefFoundError in production).
    implementation project(':fishsim')
    shadowBundle project(':fishsim')

    // Testmod: access the compiled main classes (fabric-api comes from the extendsFrom above).
    testmodImplementation sourceSets.main.output
}

processResources {
    dependsOn ':common:processResources'
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from project(":common").sourceSets.main.resources
    from file("src/main/generated")

    filesMatching('fabric.mod.json') {
        expand([
            'version': project.version,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_description': rootProject.mod_description,
            'mod_authors': rootProject.mod_authors,
            'mod_license': rootProject.mod_license,
            'mod_icon': rootProject.mod_icon,
            'mod_fabric_minecraft_version': "~${rootProject.minecraft_version}"
        ])
    }

    // Fabric's runtime is intermediary-named, so the common mixin config needs a "refmap" key or
    // Fabric Mixin can't resolve any target. It's added here, Fabric-side only: in the shared source
    // JSON it would also reach NeoForge, whose dev runtime is named and must not use a refmap
    // (potions-plus mc-1.21.1 broke NeoForge runData that way). The refmap itself comes from common.
    doLast {
        def mixinsJson = file("${destinationDir}/fishtastic.mixins.json")
        if (mixinsJson.exists()) {
            def json = new groovy.json.JsonSlurper().parse(mixinsJson)
            json.refmap = 'fishtastic-common-refmap.json'
            mixinsJson.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
        }
    }
}

// shadowJar bundles common + fishsim into a named-mappings dev jar; remapJar turns it into the
// published intermediary jar.
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // Dev-only MCP bridge tooling - never ship it. Every call site into these packages is guarded by
    // grill24.fishtastic.env.DevEnvironmentCheck, which stays in the jar, so a missing class here is safe.
    exclude 'grill24/fishtastic/mcp/**'
    exclude 'grill24/fishtastic/fabric/mcp/**'

    // fishsim's render/harness/viewer packages are dev-only verification tooling (headless PNG/GIF
    // export, the desktop viewer) — only core/ and domain/ are reachable from the mod at runtime.
    exclude 'grill24/fishsim/render/**'
    exclude 'grill24/fishsim/harness/**'
    exclude 'grill24/fishsim/viewer/**'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

loom {
    runs {
        // Fixed window size, so the self-test's evidence screenshots are comparable between the
        // two loaders and with docs/port-evidence/1.21.1 (the guiscale scene resizes to 1920x1080
        // and restores this). Flagged at G1; see docs/backport-pass2/track-a5-rendering-1.21.1.md.
        client {
            programArgs "--width", "1600", "--height", "900"
        }

        datagen {
            inherit client
            name = "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=fishtastic"
            // Lets ShopEntryFromQuestProvider read the hand-authored quest JSON (explorer/mastery/
            // challenge/tutorial/collector quests have no Java-side bootstrap data to generate shop
            // entries from otherwise) — see that class for why.
            vmArg "-Dfishtastic.quest-source-dir=${rootProject.file("common/src/main/resources/data/fishtastic/fishtastic/quest")}"

            runDir "build/datagen"
        }

        gametest {
            server()
            source sourceSets.testmod
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('junit.xml').get().asFile}"
            runDir "build/gametest"
        }
    }
}

// Custom (non-default) runDirs aren't auto-created by Loom before the run task
// executes — unlike the default "run" dir, which gets created during IDE sync.
// Without this, a fresh checkout fails the first runDatagen/runGametest invocation
// with "Working directory '...\build\datagen' does not exist".
file("build/datagen").mkdirs()
file("build/gametest").mkdirs()

tasks.register("copyGeneratedAssetsToCommon", Exec) {
    group = "fishtastic"
    description = "Merges fabric's datagen output into the common module's resources."
    workingDir rootProject.projectDir
    // `python3` is canonical on POSIX, but on Windows it usually only resolves to a
    // broken Microsoft Store alias — use `python` there instead (same 3.x interpreter).
    def python = System.getProperty("os.name").toLowerCase().contains("win") ? "python" : "python3"
    commandLine python, "scripts/copy_assets_to_common.py"
}

tasks.named("runDatagen") {
    finalizedBy tasks.named("copyGeneratedAssetsToCommon")
}
