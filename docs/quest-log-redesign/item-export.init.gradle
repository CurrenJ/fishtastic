// Export actual reward ItemStacks through Minecraft's GUI renderer, in an isolated run.
// The production source is read only: compile a generated harness copy for this run.
gradle.projectsEvaluated {
    def base = rootProject.file('docs/quest-log-redesign')
    def target = new File(base, 'run-item-export').canonicalFile
    if (target.parentFile != base.canonicalFile) throw new GradleException('Unexpected export directory')
    target.mkdirs()
    new File(target, 'fishtastic_render_selftest').text = 'questsprites\n'
    new File(target, 'options.txt').text = '''onboardAccessibility:false
overrideWidth:960
overrideHeight:540
fullscreen:false
guiScale:2
renderDistance:3
simulationDistance:3
maxFps:30
enableVsync:false
'''
    def original = rootProject.file('common/src/main/java/grill24/fishtastic/client/selftest/RenderSelfTest.java')
    def generated = new File(base, 'item-export/generated/RenderSelfTest.java')
    generated.parentFile.mkdirs()
    def extra = new File(base, 'item-export/scene.java.inc').getText('UTF-8')
    def sourceText = original.getText('UTF-8').replace('case "fixes" -> queueFixesScene();', 'case "questsprites" -> queueQuestSpritesScene();\n            case "fixes" -> queueFixesScene();')
    sourceText = sourceText.replace('!ALL_SCENES.contains(s) && !OPT_IN_SCENES.contains(s)', '!s.equals("questsprites") && !ALL_SCENES.contains(s) && !OPT_IN_SCENES.contains(s)')
    int end = sourceText.lastIndexOf('}')
    generated.setText(sourceText.substring(0, end) + extra + '\n}\n', 'UTF-8')
    rootProject.project(':common').tasks.named('compileJava').configure {
        setSource(source.filter { it.canonicalFile != original.canonicalFile } + files(generated))
    }
    def platform = rootProject.project(':fabric')
    platform.loom.runs.client.runDir(platform.projectDir.toPath().relativize(target.toPath()).toString())
    platform.loom.runs.client.vmArg('-Xms256m')
    platform.loom.runs.client.vmArg('-Xmx1536m')
    platform.loom.runs.client.vmArg('-XX:ActiveProcessorCount=4')
}
