// Keep acceptance checks within a small memory budget while a normal dev client is open.
gradle.projectsEvaluated {
    allprojects {
        tasks.withType(Test).configureEach {
            maxParallelForks = 1
            minHeapSize = '64m'
            maxHeapSize = '384m'
            jvmArgs '-XX:ActiveProcessorCount=4'
        }
    }
}
