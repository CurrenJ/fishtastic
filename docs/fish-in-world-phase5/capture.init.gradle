// Isolated Phase 5 capture; does not change the normal dev client's run directory.
//
//   .\gradlew.bat :fabric:runClient -I docs/fish-in-world-phase5/capture.init.gradle
//
// The marker arms the ambientpopulation scene (Phase 5: weighted population and equipment
// transitions). The scene needs the local pond fixture it clears and refills itself, keeps the
// player in creative and moves by tp, so it must run against an integrated server, not a join.
gradle.projectsEvaluated {
    def base = rootProject.file('docs/fish-in-world-phase5').canonicalFile
    def loader = rootProject.findProperty('ambientLoader') ?: 'fabric'
    if (!(loader in ['fabric', 'neoforge'])) throw new GradleException('Unsupported capture loader')
    def suffix = rootProject.findProperty('ambientRunSuffix') ?: ''
    if (!(suffix ==~ /[a-z0-9-]*/)) throw new GradleException('Unsupported capture suffix')
    def target = new File(base, 'run-' + loader + (suffix ? '-' + suffix : '')).canonicalFile
    if (target.parentFile != base) throw new GradleException('Unexpected capture directory')
    target.mkdirs()
    new File(target, 'fishtastic_render_selftest').text = (rootProject.findProperty('ambientScenes') ?: 'ambientpopulation\nambientlifecycle') + '\n'
    def options = new File(target, 'options.txt')
    def lines = options.exists() ? options.readLines() : []
    def captureOptions = ['onboardAccessibility': 'false', 'overrideWidth': '960', 'overrideHeight': '540',
                          'renderDistance': '6', 'simulationDistance': '5', 'maxFps': '30', 'enableVsync': 'false']
    lines.removeAll { line -> captureOptions.keySet().any { key -> line.startsWith(key + ':') } }
    options.text = (lines + captureOptions.collect { key, value -> key + ':' + value }).join('\n') + '\n'
    def platform = rootProject.project(':' + loader)
    // Loom's legacy asset calculation concatenates projectDir + runDir even on Windows.
    platform.loom.runs.client.runDir(platform.projectDir.toPath().relativize(target.toPath()).toString())
    platform.loom.runs.client.vmArg('-Xms256m')
    def heap = rootProject.findProperty('ambientHeap') ?: '1536m'
    if (!(heap ==~ /[0-9]+m/)) throw new GradleException('Unsupported capture heap')
    platform.loom.runs.client.vmArg('-Xmx' + heap)
    platform.loom.runs.client.vmArg('-XX:ActiveProcessorCount=4')
}
