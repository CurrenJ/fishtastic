// Isolated Phase 4 capture; does not change any normal dev run directory.
//
//   Solo client (flat world built by the harness): .\gradlew.bat :fabric:runClient   -I docs/fish-in-world-phase4/capture.init.gradle -Pphase4Role=solo
//   Dedicated client:                             .\gradlew.bat :fabric:runClient   -I docs/fish-in-world-phase4/capture.init.gradle -Pphase4Role=client
//   Dedicated server:                             .\gradlew.bat :fabric:runServer   -I docs/fish-in-world-phase4/capture.init.gradle -Pphase4Role=server
//
// The solo client builds the flat self-test world and runs the scene in-process (the replay
// comparison happens on the integrated server). The client role's marker joins the isolated
// server (server=localhost:25599) instead; the server runs a flat world whose top layer is water
// (generator settings below) so the joining client lands in water wherever it spawns, and logs
// every class it loads (-Xlog:class+load=info) — the "a dedicated server never loads client
// classes" evidence is a grep of that log for grill24.fishtastic.client, which must find nothing.
gradle.projectsEvaluated {
    def role = gradle.startParameter.projectProperties.get('phase4Role')
    if (!(role in ['solo', 'client', 'server'])) throw new GradleException('Set -Pphase4Role=solo, client or server')
    def base = rootProject.file('docs/fish-in-world-phase4').canonicalFile
    def target = rootProject.file("docs/fish-in-world-phase4/run-fabric-${role}").canonicalFile
    if (target.parentFile != base) throw new GradleException('Unexpected capture directory')
    target.mkdirs()
    def platform = rootProject.project(':fabric')
    if (role != 'server') {
        new File(target, 'fishtastic_render_selftest').text =
                role == 'client' ? 'ambientcontext\nserver=localhost:25599\n' : 'ambientcontext\n'
        def options = new File(target, 'options.txt')
        def lines = options.exists() ? options.readLines() : []
        def captureOptions = ['onboardAccessibility': 'false', 'overrideWidth': '960', 'overrideHeight': '540',
                              'renderDistance': '6', 'simulationDistance': '5', 'maxFps': '30', 'enableVsync': 'false']
        lines.removeAll { line -> captureOptions.keySet().any { key -> line.startsWith(key + ':') } }
        options.text = (lines + captureOptions.collect { key, value -> key + ':' + value }).join('\n') + '\n'
        // Loom's legacy asset calculation concatenates projectDir + runDir even on Windows.
        platform.loom.runs.client.runDir(platform.projectDir.toPath().relativize(target.toPath()).toString())
        platform.loom.runs.client.vmArg('-Xms256m')
        platform.loom.runs.client.vmArg('-Xmx1536m')
        platform.loom.runs.client.vmArg('-XX:ActiveProcessorCount=4')
    } else {
        // A fresh world every capture, so the generator settings below really apply. Deleting is
        // confined to the isolated run directory (checked above) — never the owner's worlds.
        def world = new File(target, 'world')
        if (world.exists()) world.deleteDir()
        new File(target, 'eula.txt').text = 'eula=true\n'
        new File(target, 'server.properties').text = [
                'online-mode=false',
                'enforce-secure-profile=false',
                'gamemode=creative',
                'difficulty=peaceful',
                'level-type=minecraft:flat',
                // Bedrock, dirt, grass — then three layers of water. Water covers the whole world,
                // so the joining client's runtime finds patches immediately and no commands are
                // needed (the client holds no op).
                'generator-settings=' +
                        '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},' +
                        '{"block":"minecraft:grass_block","height":1},{"block":"minecraft:water","height":3}],' +
                        '"biome":"minecraft:plains"}',
                'generate-structures=false',
                'level-name=world',
                'level-seed=1',
                'max-players=4',
                'view-distance=6',
                'simulation-distance=5',
                'server-port=25599',
                'spawn-protection=0',
                'motd=fishtastic phase4 capture'
        ].join('\n') + '\n'
        platform.loom.runs.server.runDir(platform.projectDir.toPath().relativize(target.toPath()).toString())
        platform.loom.runs.server.vmArg('-Xms256m')
        platform.loom.runs.server.vmArg('-Xmx1024m')
        platform.loom.runs.server.vmArg('-XX:ActiveProcessorCount=4')
        platform.loom.runs.server.vmArg('-Xlog:class+load=info')
    }
}
