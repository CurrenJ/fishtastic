// Isolated client capture: -I docs/fish-companions-world-validation.init.gradle
// -PworldLoader=fabric|neoforge -PworldScenes=companionmoods,companionworldcost,...
// Runtime files stay under the loader's ignored build directory.
gradle.projectsEvaluated {
    def loader = gradle.startParameter.projectProperties.get('worldLoader') ?: 'fabric'
    if (!(loader in ['fabric', 'neoforge'])) throw new GradleException('Unknown worldLoader')
    def platform = rootProject.project(':' + loader)
    def target = platform.file('build/companion-world-validation').canonicalFile
    target.mkdirs()
    def scenes = gradle.startParameter.projectProperties.get('worldScenes') ?: 'companionmoods'
    new File(target, 'fishtastic_render_selftest').text = scenes.split(',').join('\n') + '\n'
    def options = new File(target, 'options.txt')
    def lines = options.exists() ? options.readLines() : []
    def captureOptions = ['onboardAccessibility': 'false', 'overrideWidth': '960', 'overrideHeight': '540',
                          'renderDistance': '6', 'simulationDistance': '5', 'maxFps': '30',
                          'enableVsync': 'false', 'pauseOnLostFocus': 'false']
    lines.removeAll { line -> captureOptions.keySet().any { key -> line.startsWith(key + ':') } }
    options.text = (lines + captureOptions.collect { key, value -> key + ':' + value }).join('\n') + '\n'
    platform.loom.runs.client.runDir(platform.projectDir.toPath().relativize(target.toPath()).toString())
    platform.loom.runs.client.programArgs('--username', 'WorldTest')
    platform.loom.runs.client.vmArg('-Xms256m')
    platform.loom.runs.client.vmArg('-Xmx1536m')
    platform.loom.runs.client.vmArg('-XX:ActiveProcessorCount=4')
}
