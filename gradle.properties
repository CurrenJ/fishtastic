# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 2.0.1
mod_description = Fishfishfish.
mod_id = fishtastic
mod_name = Fishtastic
mod_authors = grill24
mod_license = CC0-1.0
mod_icon = icon.png
mod_neoforge_version_range = [${neoforge_version},)
mod_minecraft_version_range = [${minecraft_version},)
mod_fabric_minecraft_version = ~${minecraft_version}
mod_gelatinui_version_range = [${gelatinui_version},)
maven_group = grill24.fishtastic
archives_name = fishtastic
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version=1.21.1

# Dependencies
fabric_loader_version = 0.17.2
fabric_api_version = 0.116.7+1.21.1
neoforge_version = 21.1.209
# 1.0.32 adds the opt-in element z offset (IUIElement#setZOffset) that the leaderboard podium
# needs on this loader: 1.21.1 paints GUI children depth-tested, so a composition mixing vanilla
# items (z=150) with gelatin's posed player (z=100) would otherwise be ordered by depth rather
# than paint order. See LeaderboardScreen's PODIUM_*_Z_* constants.
gelatinui_version = 1.0.32+1.21.1
jei_version = 19.18.10.218
