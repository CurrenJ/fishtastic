# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 2.0.1
mod_description = Fishfishfish.
mod_id = fishtastic
mod_name = Fishtastic
mod_authors = grill24
mod_license = CC0-1.0
mod_icon = icon.png
mod_minecraft_version_range = [${minecraft_version},)
mod_fabric_minecraft_version = ~${minecraft_version}
mod_gelatinui_version_range = [${gelatinui_version},)
maven_group = grill24.fishtastic
archives_name = fishtastic
enabled_platforms = fabric,forge

# Minecraft properties
minecraft_version=1.20.1

# Minimum Java runtime for this branch's jars (toolchain 17, mixin compatibility JAVA_17).
# Templated into fabric.mod.json's "java" floor and sent to CurseForge as the file's Java tag, so
# the two can't drift apart.
java_version = 17

# Dependencies
fabric_loader_version = 0.16.14
fabric_api_version = 0.92.12+1.20.1
forge_version = 47.4.23
# G-G2 (docs/backport-pass2/track-b-1.20.1.md): published to mavenLocal via gelatin-ui's own
# publishToMavenLocal (gelatin-ui-worktrees/mc-1.20.1). 1.0.36 (commit bdc7edb) fixes
# MenuRegistrationEvent firing before dependent mods (e.g. Fishtastic) register their listeners on
# Forge - see GelatinUiModForge's RegisterEvent(Registries.MENU) hook and
# GelatinUi.fireMenuRegistrationEvent. 1.0.37 (commit 7865865) adds
# forge/src/main/resources/pack.mcmeta - Forge was logging "Missing metadata in pack mod:gelatinui"
# and, for real this time, failing to load its own textures (progress bar sprites).
gelatinui_version = 1.0.37+1.20.1
jei_version = 15.20.0.117
