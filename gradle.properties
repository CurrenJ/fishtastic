# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Pinned to this project only (not the user-level gradle.properties) so other worktrees on
# older Minecraft/Java versions aren't forced onto Java 25 too.
org.gradle.java.home=C:/Users/curre/.gradle/jdks/eclipse_adoptium-25-amd64-windows.2

# Mod properties
mod_version = 2.0.1
mod_description = Fishfishfish.
mod_id = fishtastic
mod_name = Fishtastic
mod_authors = grill24
mod_license = CC0-1.0
mod_icon = icon.png
mod_neoforge_version_range = [${neoforge_version},)
mod_minecraft_version_range = [${minecraft_version},)
mod_fabric_minecraft_version = ~${minecraft_version}
mod_gelatinui_version_range = [${gelatinui_version},)
maven_group = grill24.fishtastic
archives_name = fishtastic
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version=26.1.2

# Minimum Java runtime for this branch's jars (toolchain 25, mixin compatibility JAVA_25).
# Templated into fabric.mod.json's "java" floor and sent to CurseForge as the file's Java tag, so
# the two can't drift apart.
java_version = 25

# Dependencies
fabric_loader_version = 0.19.1
fabric_api_version = 0.155.2+26.1.2
neoforge_version = 26.1.2.100
gelatinui_version = 1.0.31+26.1.2
jei_version = 29.33.0.87
coolcam_version = 0.1.0+26.1.2
