architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/fishtastic.accesswidener")
}

// Creates modTestImplementation & co., so the test source set gets remapped mod dependencies too.
loom.createRemapConfigurations(sourceSets.test)

// PORT-ONLY (A6.1): NeoForge's two gametest annotations as a compile-only artifact. NeoForge 21.1
// requires @GameTestHolder + @PrefixGameTestTemplate(false) on the class that *declares* the tests,
// and the one shared harness (src/testmod) is compiled for both loaders - so Fabric's compile has
// to resolve them as well. They are never shipped and never on a runtime classpath: at runtime the
// annotation must be NeoForge's own class, or its lookup by Class would miss the shadowing copy and
// quietly disable the holder. See docs/backport-pass2/track-a-1.21.1.md, "A6.1 as built".
sourceSets {
    neoforgeGametestAnnotations {
        java.srcDirs = ['src/neoforge-gametest-annotations/java']
    }
}

configurations {
    // Consumed by the fabric/neoforge testmod compile classpaths (testmodCompileOnly).
    neoforgeGametestAnnotationsApi {
        canBeConsumed = true
        canBeResolved = false
    }
}

// A jar, not the source set's output: only an archive task (or a File/Provider) is a valid
// artifact notation, and a jar is the form the testmod compile classpaths consume cleanly.
tasks.register('neoforgeGametestAnnotationsJar', Jar) {
    archiveClassifier = 'neoforge-gametest-annotations'
    from sourceSets.neoforgeGametestAnnotations.output
}

artifacts {
    neoforgeGametestAnnotationsApi tasks.named('neoforgeGametestAnnotationsJar')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury injectables (annotations only, no runtime API)
    modImplementation "dev.architectury:architectury-injectables:1.0.13"

    modCompileOnly("io.github.currenj.gelatinui:gelatinui-common:${gelatinui_version}")

    // JEI integration is optional at runtime (see grill24.fishtastic.compat.jei) — only
    // needed on the compile classpath so the plugin class can reference the JEI API.
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")

    // The Minecraft-free flocking engine (docs/fish-sim-engine-plan.md). Each platform bundles it
    // into the shipped jar via its own shadowBundle dependency — this line only provides the
    // compile/dev classpath here.
    implementation project(':fishsim')

    // Unit testing — gelatinui is compileOnly above (provided by the platform jar at
    // runtime), but JUnit tests run outside any platform, so the test source set needs
    // its own real dependency on it to construct UIElement/UIContainer instances.
    // modTestImplementation (not testImplementation) so Loom remaps the published jar to named.
    modTestImplementation("io.github.currenj.gelatinui:gelatinui-common:${gelatinui_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Use JUnit Platform for unit tests
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// common is never consumed as a jar: each platform takes the named classes (namedElements) and the
// transformProduction* output. remapJar's named -> intermediary remap is unneeded here and fails on
// vanilla's Container/RecipeInput bridge-method ambiguity (potions-plus mc-1.21.1), so it's off.
tasks.named('remapJar') { enabled = false }
