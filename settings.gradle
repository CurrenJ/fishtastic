pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'fishtastic'

include 'common'
include 'fabric'
include 'neoforge'

// Standalone dev tooling for the fish tank shape-variants design (see
// docs/tank-shape-variants-plan.md) — plain Java, deliberately independent of
// Minecraft/Loom/Architectury so it builds and iterates fast.
include 'tools:tank-shape-gen'
include 'tools:tank-shape-previewer'
