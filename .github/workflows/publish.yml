name: Publish to CurseForge

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        default: 'release'
        options:
          - alpha
          - beta
          - release
      changelog_override:
        description: 'Changelog (leave empty to use CHANGELOG.md)'
        required: false
        type: string
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          RELEASE_TYPE="${{ inputs.release_type || 'release' }}"
          CHANGELOG_OVERRIDE="${{ inputs.changelog_override || '' }}"
          if [ -n "${CHANGELOG_OVERRIDE}" ]; then
            ./gradlew publishCurseForge -Prelease_type="${RELEASE_TYPE}" -Pchangelog_override="${CHANGELOG_OVERRIDE}"
          else
            ./gradlew publishCurseForge -Prelease_type="${RELEASE_TYPE}"
          fi
