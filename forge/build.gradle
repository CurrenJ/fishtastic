plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        // Platform-agnostic GameTest logic lives in common/ so Fabric can share it too.
        java.srcDir(project(':common').file('src/testmod/java'))
        resources.srcDir(project(':common').file('src/testmod/resources'))
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    // G-G2 (docs/backport-pass2/track-b-1.20.1.md): gelatinui-*-1.20.1 published to
    // mavenLocal via gelatin-ui's own publishToMavenLocal (see gelatin-ui-worktrees/mc-1.20.1).
    modImplementation("io.github.currenj.gelatinui:gelatinui-forge:${gelatinui_version}")

    // JEI integration is optional at runtime — compile-only api, plus the full jar as a
    // dev-time convenience so `runClient` can exercise the integration locally.
    // transitive = false: JEI's published forge-api/forge POMs declare their common-api
    // dependency under a bogus "build" groupId (a JEI publishing quirk), which fails
    // resolution — harmless to disable since we depend on common-api explicitly ourselves.
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    compileOnly("mezz.jei:jei-${rootProject.minecraft_version}-forge-api:${rootProject.jei_version}") { transitive = false }
    localRuntime("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}") { transitive = false }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // MixinExtras (B6.1, docs/backport-pass2/track-b-1.20.1.md "B6.1 as built"): Forge 47 has no
    // built-in MixinExtras (unlike NeoForge) and this module doesn't use the JarJar packaging the
    // published mixinextras-forge artifact expects (a nested jar, meant to be unpacked by FML's
    // JarJar dependency locator) — so mixinextras-common's flat classes are shaded straight into
    // the jar instead, bootstrapped manually by FishtasticMixinExtrasPlugin.
    // forgeRuntimeLibrary is what makes it visible in dev runs: a plain `implementation` jar only
    // lands on the JVM classpath, which ModLauncher's module layers can't see, so the plugin's
    // onLoad threw NoClassDefFoundError on "main" — printed only to stderr, never to the log files,
    // and the JVM then idled forever on FML's non-daemon pool threads (the B6.1 "hang").
    implementation "io.github.llamalad7:mixinextras-common:0.5.4"
    forgeRuntimeLibrary "io.github.llamalad7:mixinextras-common:0.5.4"
    shadowBundle "io.github.llamalad7:mixinextras-common:0.5.4"

    // Flocking engine (docs/fish-sim-engine-plan.md): runtime code, so it needs BOTH a dev
    // classpath dep and a shadowBundle entry — dev runs resolve the former, the shipped jar only
    // contains the latter (skipping it = NoClassDefFoundError in production).
    implementation project(':fishsim')
    shadowBundle project(':fishsim')

    // Testmod: access the compiled main classes.
    testmodImplementation sourceSets.main.output
    // B6.1: unlike Fabric, Forge needs no compile-only gametest-annotations stub — Forge 47 ships
    // real @GameTestHolder/@PrefixGameTestTemplate classes of its own, already on this module's
    // main compileClasspath via the `forge` dependency above, which sourceSets.testmod extends.
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version

    from project(":common").sourceSets.main.resources

    filesMatching('META-INF/mods.toml') {
        expand([
            'version': project.version,
            'mod_license': rootProject.mod_license,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_authors': rootProject.mod_authors,
            'mod_description': rootProject.mod_description,
            'mod_icon': rootProject.mod_icon,
            'mod_minecraft_version_range': "[${rootProject.minecraft_version},)",
            'mod_gelatinui_version_range': "[${gelatinui_version},)"
        ])
    }
}

// shadowJar bundles common + fishsim into a dev jar; remapJar produces the published jar.
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // Forge 1.20.1's production runtime is SRG-named, so the common mixin config needs a "refmap"
    // key or Forge Mixin resolves nothing in it: the client dies before the main menu with "Mixin
    // apply failed fishtastic.mixins.json:GuiGraphicsMixin ... No refMap loaded." (every common
    // mixin is dropped, not just that one). Same trap as N8, same shape of fix as the Fabric
    // module's copy — the key is added platform-side rather than in the shared source JSON, which
    // would also reach NeoForge and name a file common's own module never puts in its jar. The
    // refmap comes from common (one name per module, root build.gradle); the Forge remap is what
    // gives this jar the SRG-namespaced copy ("data": {"searge": ...}) Forge 1.20.1 Mixin looks for.
    //
    // Only the *jar* gets the key, never processResources (which the dev runs load from): the dev
    // runtime is Mojang-named and the common refmap carries only "named:intermediary" data, so a
    // dev run that reads it feeds Mixin intermediary names ("class_332") and every mixin fails with
    // "target class ... is not supported" (runClient, runGametest — the JVM then never exits). With
    // no refmap the dev run resolves the mojmap names in the mixin sources directly.
    filesMatching('fishtastic.mixins.json') {
        filter { line ->
            line.contains('"required"')
                    ? line + '\n  "refmap": "fishtastic-common-refmap.json",'
                    : line
        }
    }

    // Dev-only MCP bridge tooling - never ship it. Every call site into these packages is guarded by
    // grill24.fishtastic.env.DevEnvironmentCheck, which stays in the jar, so a missing class here is safe.
    exclude 'grill24/fishtastic/mcp/**'
    exclude 'grill24/fishtastic/forge/mcp/**'

    // fishsim's render/harness/viewer packages are dev-only verification tooling (headless PNG/GIF
    // export, the desktop viewer) — only core/ and domain/ are reachable from the mod at runtime.
    exclude 'grill24/fishsim/render/**'
    exclude 'grill24/fishsim/harness/**'
    exclude 'grill24/fishsim/viewer/**'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

sourceSets.main.resources.srcDir("src/main/generated")

// Gradle 9.2+ requires explicit duplicatesStrategy when sources overlap.
tasks.named('sourcesJar').configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        mixinConfig "fishtastic.mixins.json", "fishtastic-forge.mixins.json"
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
    }

    // See the equivalent block on port/1.21.1's neoforge/build.gradle for why testmod and
    // :fishsim need their own mod group.
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet sourceSets.testmod
            sourceSet("main", project(':fishsim'))
        }
    }

    runs {
        client {
            programArgs "--width", "1600", "--height", "900"
        }

        data {
            environment("data")
            forgeTemplate("data")
            programArgs "--mod", "fishtastic",
                        "--all",
                        "--output", file("src/main/generated").absolutePath
        }

        // Headless game test server — runs all registered tests then exits.
        // Run with: ./gradlew :forge:runGametest
        gametest {
            environment("gameTestServer")
            forgeTemplate("gameTestServer")
            source sourceSets.testmod
            name "Game Test Server"
            vmArg "-Dforge.enabledGameTestNamespaces=fishtastic"
            runDir "build/gametest"
        }
    }
}

// JEI's own DistExecutor.safeRunWhenOn(CLIENT, ...) fires during its client init and calls
// I18n.get(...) by its SRG name; Architectury Loom's runtime remapper doesn't reliably have that
// name resolved on net.minecraft.client.resources.language.I18n by the time JEI's CONSTRUCT event
// runs in this dev environment, so JEI throws a NoSuchMethodError building its key mappings and
// ModLoader's CONSTRUCT event fails fatally. On "data" this hangs the JVM forever on FML's
// non-daemon worker pool (same shape as the B6.1 gametest fix); on "client" it just shows the fatal
// mod-loading crash screen. Originally thought to only hit "data" (a real "client" launch was
// assumed to wire up I18n correctly) — confirmed 2026-09-26 that "client" hits it too, reproducibly.
// JEI is `localRuntime`-only (dev convenience, see the dependencies block) and neither run actually
// needs it, so drop its jar from both runs' classpaths instead of chasing the upstream
// JEI/Architectury-Loom remapper-ordering bug. If JEI-in-dev-client is needed again, use a real
// (non-dev) Forge install instead.
tasks.named("runData") {
    classpath = classpath.filter { !it.name.startsWith("jei-") }
}
tasks.named("runClient") {
    classpath = classpath.filter { !it.name.startsWith("jei-") }
}

// Custom (non-default) runDirs aren't auto-created by Loom/Architectury before the
// run task executes — unlike the default "run" dir, which gets created during IDE
// sync. Without this, a fresh checkout fails the first `runGametest` invocation with
// "Working directory '...\build\gametest' does not exist".
file("build/gametest").mkdirs()
